# Pubblica una release installabile da Foundry.
# Parte quando cambia module.json (o a mano). Se la release v<version>
# esiste già non fa niente: per pubblicarne una nuova basta alzare
# "version" in module.json. Il giro crea il tag, mette insieme module.zip
# con i soli file che servono al modulo, riscrive il "download" del
# manifest sulla versione e allega tutti e due.
# Il link da incollare in Foundry resta sempre lo stesso:
#   https://github.com/ItzLaVolpe17/cprx-agent/releases/latest/download/module.json
name: Release

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["module.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: v
        run: |
          TAG="v$(jq -r .version module.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: niente da fare."
            echo "esiste=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifiche
        if: steps.v.outputs.esiste != '1'
        run: |
          node --check scripts/agent.js
          python3 -c "import json; [json.load(open(f)) for f in ['module.json','lang/it.json','lang/en.json']]"

      - name: Manifest e pacchetto
        if: steps.v.outputs.esiste != '1'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}"
          TAG="${{ steps.v.outputs.tag }}"
          jq --arg url "$URL" --arg tag "$TAG" '
            .url = $url |
            .manifest = ($url + "/releases/latest/download/module.json") |
            .download = ($url + "/releases/download/" + $tag + "/module.zip")
          ' module.json > module.release.json
          mv module.release.json module.json
          zip -r module.zip module.json scripts templates styles lang assets README.md

      - name: Release
        if: steps.v.outputs.esiste != '1'
        run: |
          gh release create "${{ steps.v.outputs.tag }}" module.json module.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes \
            --latest
